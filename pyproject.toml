[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-observability-platform"
version = "0.1.0"
description = "Configurable observability MVP for Oracle-to-Sqoop-to-Impala data pipelines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "PyYAML>=6.0,<7.0",
  "impyla>=0.19,<1.0",
  "oracledb>=2.4,<4.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0"]

[project.scripts]
obs = "data_observability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
